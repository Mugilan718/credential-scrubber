# rules.yaml
# Detection rules for credential-scrubber.
# Edit this file to add/remove detection rules WITHOUT touching scrub.py.

# ------------------------------------------------------------------
# 1. KEY-NAME RULES (for config files: .properties, .yml, .env, .json, .xml)
# If a config key matches one of these (case-insensitive, partial match),
# its value is ALWAYS redacted, regardless of what the value looks like.
# ------------------------------------------------------------------
key_patterns:
  - "password"
  - "passwd"
  - "pwd"
  - "secret"
  - "token"
  - "api[_-]?key"
  - "apikey"
  - "access[_-]?key"
  - "private[_-]?key"
  - "client[_-]?secret"
  - "auth"
  - "credential"
  - "connection[_-]?string"
  - "conn[_-]?str"
  - "jdbc"
  - "datasource\\.url"
  - "db\\.url"
  - "db\\.host"
  - "db\\.password"
  - "db\\.username"
  - "host"
  - "hostname"
  - "ip[_-]?address"
  - "endpoint"
  - "url"
  - "uri"
  - "ssn"
  - "encryption[_-]?key"
  - "signing[_-]?key"
  - "session[_-]?key"
  - "cert"
  - "keystore"
  - "truststore"
  - "username"
  - "port"

# ------------------------------------------------------------------
# 2. VALUE-PATTERN RULES (applies to config files AND source code)
# If a value matches one of these regexes anywhere, it's redacted
# even if the key/variable name looks harmless.
# ------------------------------------------------------------------
value_patterns:
  - name: "ipv4_address"
    regex: "\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b"

  - name: "ipv6_address"
    regex: "\\b([0-9a-fA-F]{1,4}:){2,7}[0-9a-fA-F]{1,4}\\b"

  - name: "url_with_credentials"
    regex: "[a-zA-Z][a-zA-Z0-9+.-]*://[^\\s:/@]+:[^\\s:/@]+@[^\\s\"']+"

  - name: "generic_url"
    regex: "(https?|ftp|jdbc:[a-z]+|mongodb(\\+srv)?|redis|amqp)://[^\\s\"']+"

  - name: "aws_access_key_id"
    regex: "\\bAKIA[0-9A-Z]{16}\\b"

  - name: "aws_secret_key_assignment"
    regex: "(?i)aws_secret_access_key[\"']?\\s*[:=]\\s*[\"']?[A-Za-z0-9/+=]{40}"

  - name: "github_token"
    regex: "\\bgh[pousr]_[A-Za-z0-9]{36}\\b"

  - name: "slack_token"
    regex: "\\bxox[baprs]-[A-Za-z0-9-]{10,}\\b"

  - name: "jwt_token"
    regex: "\\beyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\b"

  - name: "bearer_token"
    regex: "(?i)bearer\\s+[A-Za-z0-9\\-._~+/]+=*"

  - name: "private_key_block"
    regex: "-----BEGIN [A-Z ]*PRIVATE KEY-----[\\s\\S]+?-----END [A-Z ]*PRIVATE KEY-----"

  - name: "email_address"
    regex: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"

# ------------------------------------------------------------------
# 3. CODE VARIABLE-ASSIGNMENT PATTERNS (per language)
# Recognizes "suspicious variable/field name = string literal" in source code.
# Group 1 in each regex must capture the string literal's inner content
# so the tool can mask just the value, keeping code syntactically valid.
# The variable-name part reuses the same suspicious words as key_patterns.
# ------------------------------------------------------------------
code_patterns:
  java:
    - '(?i)(?:String|final\s+String)\s+\w*(?:password|secret|token|apikey|api_key|key|credential|auth)\w*\s*=\s*"([^"]*)"'
  python:
    - "(?i)\\w*(?:password|secret|token|apikey|api_key|key|credential|auth)\\w*\\s*=\\s*[\"']([^\"']*)[\"']"
    - "(?i)(?:os\\.getenv|os\\.environ\\.get)\\(\\s*[\"'][^\"']*(?:password|secret|token|apikey|api_key|key|credential|auth)[^\"']*[\"']\\s*,\\s*[\"']([^\"']*)[\"']\\s*\\)"
  javascript:
    # Optional (?:\s*:\s*[^=;\n]+?)? allows a TypeScript type annotation between the
    # variable name and '=' (e.g. `: string`, `: string | undefined`, `: any`) so
    # annotated declarations are caught the same as plain JS ones.
    - "(?i)(?:const|let|var)\\s+\\w*(?:password|secret|token|apikey|api_key|key|credential|auth)\\w*\\s*(?::\\s*[^=;\\n]+?)?\\s*=\\s*[`\"'](.*?)[`\"']"
  go:
    - '(?i)\w*(?:password|secret|token|apikey|api_key|key|credential|auth)\w*\s*:?=\s*"([^"]*)"'
  csharp:
    - '(?i)(?:string|var)\s+\w*(?:password|secret|token|apikey|api_key|key|credential|auth)\w*\s*=\s*"([^"]*)"'

# ------------------------------------------------------------------
# 4. PLACEHOLDER ALLOW-LIST
# Values that LOOK like secrets but are actually dummy/placeholder text.
# These are matched case-insensitively as a whole match and skipped
# (not redacted), to keep the audit report noise-free.
# ------------------------------------------------------------------
placeholder_allowlist:
  - "changeme"
  - "change_me"
  - "your_api_key_here"
  - "your-api-key-here"
  - "yourapikeyhere"
  - "example"
  - "dummy"
  - "placeholder"
  - "xxxxxxxx"
  - "test123"
  - "localhost"
  - "127.0.0.1"
  - "0.0.0.0"
  - "none"
  - "null"
  - "n/a"
  - "todo"
  - "fixme"
  - "insert_secret_here"
