name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Playwright isn't in requirements-dev.txt (tests/test_folder_filter_ui.py
      # guards on pytest.importorskip("playwright") and skips cleanly without
      # it) - installed here on 3.12 only, to actually exercise that UI
      # regression test in CI without doubling the browser-install cost
      # across the whole matrix.
      - name: Install Playwright (Chromium) for the folder-filter UI test
        if: matrix.python-version == '3.12'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run pytest
        run: python -m pytest tests/ -v
